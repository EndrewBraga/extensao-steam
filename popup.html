<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Gastos em Jogos</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Gastos em Jogos</h1>

    <!-- Abas: cada botão mostra o painel de mesmo nome (data-aba="resumo" -> #painel-resumo).
         Só o Resumo (geral) é fixo. Uma aba e um painel por loja são criados pelo popup.js,
         a partir da lista LOJAS. -->
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="resumo" aria-selected="true">Resumo</button>
    </nav>

    <div id="painel-resumo">
      <button id="atualizar-todas" class="botao-pequeno" hidden>Atualizar todas as lojas</button>
      <p id="resumo-mensagem" class="mensagem" hidden></p>

      <div id="resumo-conteudo" hidden>
        <div class="total">
          <small>Total gasto</small>
          <span id="liquido"></span>
        </div>

        <div id="cards" class="cards"></div>

        <h2 id="lojas-titulo">Por loja</h2>
        <ul id="lojas-barras" class="barras lojas"></ul>

        <h2>Por ano</h2>
        <ul id="anos" class="barras"></ul>

        <p id="pendentes" class="nota" hidden></p>
      </div>
    </div>

    <!-- No Manifest V3 o JS não pode ser escrito dentro do HTML: precisa ser um arquivo.
         type="module" permite usar "import" (o popup importa o módulo de cada loja). -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
